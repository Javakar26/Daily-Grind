<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E151D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Grind">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Daily Grind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one Today scoreboard with three colored lanes (gym, diet, sleep); a bottom tab bar opens each lane; Targets holds goals and reminders. */
:root{
  --bg:#EEF2F6; --surface:#FFFFFF; --surface2:#E3E9F0; --line:#D2DAE3;
  --fg:#101A26; --muted:#566475;
  --gym:#C93B16; --diet:#17794F; --sleep:#6A4CCF;
  --danger:#B4231A; --on-area:#FFFFFF;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151D; --surface:#16202B; --surface2:#1F2C3A; --line:#2B3B4C;
    --fg:#E8EEF4; --muted:#93A3B4;
    --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF;
    --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151D; --surface:#16202B; --surface2:#1F2C3A; --line:#2B3B4C;
  --fg:#E8EEF4; --muted:#93A3B4;
  --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF;
  --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;
}
/* background themes (after the light and dark blocks so they win) */
:root[data-bg="navy"]{--bg:#0A1426; --surface:#121F38; --surface2:#1B2B4A; --line:#2A3C60; --fg:#E9F0FF; --muted:#9BB0D3; --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF; --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;}
:root[data-bg="charcoal"]{--bg:#121212; --surface:#1C1C1E; --surface2:#272729; --line:#38383B; --fg:#F2F2F2; --muted:#A0A0A6; --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF; --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;}
:root[data-bg="forest"]{--bg:#0B1A14; --surface:#12271E; --surface2:#1A372A; --line:#28503D; --fg:#E6F4EC; --muted:#92B8A3; --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF; --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;}
:root[data-bg="plum"]{--bg:#170E22; --surface:#21152F; --surface2:#2E1D42; --line:#44295F; --fg:#F1E9FA; --muted:#B5A0CC; --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF; --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;}
:root[data-bg="sand"]{--bg:#F4EDE0; --surface:#FFFBF3; --surface2:#EBE1CF; --line:#D9CCB4; --fg:#2A2116; --muted:#6E6250; --gym:#C93B16; --diet:#17794F; --sleep:#6A4CCF; --danger:#B4231A; --on-area:#FFFFFF; color-scheme:light;}
:root[data-bg="sky"]{--bg:#E4F1FB; --surface:#FFFFFF; --surface2:#D3E7F6; --line:#B9D5EA; --fg:#0C2236; --muted:#4E6A82; --gym:#C93B16; --diet:#17794F; --sleep:#6A4CCF; --danger:#B4231A; --on-area:#FFFFFF; color-scheme:light;}
:root[data-bg="photo"]{--bg:#0A0F16; --surface:rgba(10,16,24,.68); --surface2:rgba(32,42,56,.72); --line:rgba(255,255,255,.18); --fg:#F4F7FA; --muted:#C9D3DE; --gym:#FF7A55; --diet:#4CC590; --sleep:#A996FF; --danger:#FF7A70; --on-area:#0E151D; color-scheme:dark;}
:root[data-bg="photo"] .tabs{background:#0A1018}
#bgpic{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center}
.bgs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bgo{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;min-width:0}
.bgo i{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--sw)}
.bgo[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:1px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg);
  font:400 15px/1.45 var(--font-body);
  padding-block:12px calc(92px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
#app{max-width:560px;margin:0 auto}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c,var(--fg));outline-offset:2px}
.num{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.lbl{font:600 12px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
small{color:var(--muted);font-size:13px}

/* header */
.top-row{display:flex;align-items:center;gap:10px;min-height:36px}
.brand{font:700 20px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase}
.sync{flex:1;min-width:0;font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar,.pfav{color:var(--muted)}
.avatar{flex:0 0 36px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;font:700 15px/1 var(--font-body);padding:0;display:grid;place-items:center}
.avatar[aria-current=page]{outline:2px solid var(--fg);outline-offset:1px}
.bmibar{position:relative;display:flex;gap:2px;height:14px;margin-top:4px}
.bmibar i{display:block;border-radius:4px;background:var(--c);opacity:.85}
.bmibar span{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;border-radius:2px;background:var(--fg);box-shadow:0 0 0 2px var(--surface)}
.bmilab{display:flex;justify-content:space-between;gap:4px;font-size:11px;color:var(--muted)}
.bmilab span{min-width:0}
.crop{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.crop[hidden]{display:none}
.ctitle{font-size:16px;font-weight:600}
.chint{font-size:13px;color:#a0a0a8;margin-top:-12px}
.stage{position:relative;width:min(100%,360px);aspect-ratio:1/1;overflow:hidden;touch-action:none;cursor:grab;background:#000;user-select:none;-webkit-user-select:none}
.stage canvas{width:100%;height:100%;display:block}
.cmask{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.62);pointer-events:none;border:2px solid rgba(255,255,255,.85)}
.cbtns{width:min(100%,360px)}
.crop .btn{background:#1d1d1f;border-color:#3a3a3c;color:#fff}
.crop .btn.pri{background:#fff;color:#000}
.sheetbg{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.5)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;max-width:560px;margin:0 auto}
.sheet[hidden],.sheetbg[hidden]{display:none}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet .lbl{margin-bottom:6px}
.srow{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;min-height:52px;padding:0 6px;border:0;background:none;font-size:16px;font-weight:500;text-align:left;width:100%;border-radius:10px}
.srow:hover{background:var(--surface2)}
.srow input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.srow .sic{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:0 0 40px}
.srow svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.srow.cancel{justify-content:center;margin-top:6px;border:1px solid var(--line);font-weight:600}
.pfavwrap{position:relative;flex:0 0 72px;width:72px;height:72px}
.pfavwrap .pfav{width:72px;height:72px;padding:0;cursor:pointer}
.cam{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;border:2px solid var(--bg);pointer-events:none}
.cam svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pfhead{display:flex;align-items:center;gap:14px}
.pfav{flex:0 0 72px;width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;font:700 28px/1 var(--font-display)}
.greet{font-size:15px;color:var(--muted);margin-bottom:10px}
.greet b{color:var(--fg);font-weight:600}
.spacer{flex:1}
header{position:relative}
.more{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;flex:0 0 36px;width:36px;height:36px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;font-weight:700}
.more[aria-current=page]{background:var(--fg);color:var(--bg)}
.menu{position:absolute;right:0;top:44px;z-index:8;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.menu button{display:block;width:100%;text-align:left;min-height:44px;padding:0 12px;border:0;background:none;border-radius:8px;font-weight:600;font-size:14px}
.menu button:hover{background:var(--surface2)}
.menu .msync{font-size:12px;color:var(--muted);padding:6px 12px 6px}
.gear{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.gear[aria-current=page]{background:var(--fg);color:var(--bg)}
.datebar{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.dn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.dn:disabled{opacity:.35;cursor:default}
.dlabel{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 22px/1.1 var(--font-display);letter-spacing:.02em}
.datebar[hidden]{display:none}

/* shared parts */
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.grow{flex:1 1 140px;min-width:0}
.sm{flex:0 1 86px;min-width:0}
input,select{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-size:16px;min-width:0;width:100%}
.row>input,.row>select{width:auto}
input::placeholder{color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.btn.pri{background:var(--c,var(--fg));color:var(--on-area);border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:13px;flex:0 0 auto}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.sec>h3{font:600 12px/1.2 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.empty{color:var(--muted);font-size:14px;padding:4px 0}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:500}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;width:var(--p,0%);background:var(--c);border-radius:99px;transition:width .3s}
.meter{display:flex;flex-direction:column;gap:6px}
.mrow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.mrow b{font-size:18px}

.ringw{position:relative;display:grid;place-items:center;flex:none}
.ringw svg{display:block}
.rt{fill:none;stroke:var(--surface2);stroke-width:5}
.rp{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round}
.rl{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}

.chk{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 0;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.chk .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--on-area)}
.chk .box svg{opacity:0}
.chk[aria-pressed=true] .box{background:var(--c);border-color:var(--c)}
.chk[aria-pressed=true] .box svg{opacity:1}
.chk[aria-pressed=true] .lbl2{color:var(--muted);text-decoration:line-through}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item>div{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.item b{font-weight:600;overflow-wrap:anywhere}
.x{min-height:40px;padding:0 10px;border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;text-decoration:underline}

.vhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.vhead h2{font:700 34px/1.05 var(--font-display);letter-spacing:.01em;color:var(--c)}

/* Today */
.hero{display:flex;align-items:center;gap:18px;padding:4px 0 6px}
.hero .big{font-size:60px;line-height:.9}
.hero .big small{font-size:26px;color:var(--muted);margin-left:2px}
.hero p.sub{margin-top:6px;color:var(--muted);font-size:14px}
.hint{margin-top:10px;padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:14px}
.lanes{display:grid;gap:12px;margin-top:16px}
.lane{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lane-head{display:flex;justify-content:space-between;align-items:baseline;background:none;border:0;padding:0;min-height:32px;width:100%;text-align:left}
.lane-name{font:700 24px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.lane-pct{font-size:28px}
.stat{font-size:14px;color:var(--muted)}
.lane-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lane-foot .done{font-size:13px;color:var(--muted);font-weight:600}
.streak{font-size:12px;font-weight:600;color:var(--c)}
.chart{display:block;width:100%;height:auto}
.chart .b{fill:var(--c);opacity:.5}
.chart .b.hi{opacity:1}
.chart .grid{stroke:var(--line);stroke-dasharray:3 3}
.chart text{fill:var(--muted);font:500 10px var(--font-body)}
.chart .vl{fill:var(--fg)}
.chart .ln{fill:none;stroke:var(--c);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--c)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .hd{text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dn.sm{width:36px;height:36px;font-size:20px}
.cell{aspect-ratio:1/1;min-height:36px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:600;
  background:color-mix(in srgb,var(--fg) var(--h,0%),var(--surface2));color:var(--fg);padding:0}
.cell.dark{color:var(--bg)}
.cell.cur{outline:2px solid var(--fg);outline-offset:1px}
.cell:disabled{opacity:.35;cursor:default}

/* gym week */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted);min-width:0}
.wd b{font-size:12px;color:var(--fg);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wd.on{background:var(--c);border-color:var(--c)}
.wd.on,.wd.on b{color:var(--on-area)}
.wd.cur{outline:2px solid var(--fg);outline-offset:1px}

/* sleep */
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats3>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats3 b{font-size:24px}
.over{color:var(--danger)}

/* week */
.wkbar{display:flex;align-items:center;gap:8px;margin:8px 0 14px}
.wkbar .wl{flex:1;text-align:center;font-weight:600;font-size:15px;min-width:0}
.delta{font-size:13px;font-weight:600;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dg{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted);min-width:0}
.dg b{font-size:13px;color:var(--fg);font-weight:600}
.dg.good{background:var(--fg);border-color:var(--fg)}
.dg.good,.dg.good b{color:var(--bg)}
.dg:disabled{opacity:.4}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kv>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv small{color:var(--muted);font-size:12px}
.kv b{font-size:20px}
/* targets */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rem{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rem input[type=time]{flex:0 0 112px;width:112px}
.rem input[data-f=l]{flex:1 1 140px}
.rem select{flex:1 1 90px;width:auto}
.sw{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;min-height:44px}
.sw input{width:22px;height:22px;accent-color:var(--fg)}

/* reminders banner */
.banner{margin-bottom:14px;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;
  background:color-mix(in srgb,var(--c,var(--fg)) 13%,var(--surface));border:1px solid color-mix(in srgb,var(--c,var(--fg)) 40%,var(--line))}
.banner .brow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.banner .brow>div{flex:1 1 160px;min-width:0;display:flex;flex-direction:column}
.banner b{font-weight:600}
.banner .when{font-size:12px;color:var(--muted)}

/* tabs and toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:4px max(16px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;padding:4px 0;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;min-width:0}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--c,var(--fg))}
.tab[data-go=today]{--c:var(--fg)}
.tab[data-go=week]{--c:var(--fg)} .tab[data-go=gym]{--c:var(--gym)} .tab[data-go=diet]{--c:var(--diet)} .tab[data-go=sleep]{--c:var(--sleep)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

<body>
<div id="bgpic" aria-hidden="true" hidden></div>
<div id="app">
  <header>
    <div class="top-row">
      <span class="brand">Daily Grind</span>
      <span class="spacer"></span>
      <button class="avatar" id="avbtn" data-go="profile" aria-label="Profile"></button>
      <button class="more" id="morebtn" data-act="menu" aria-label="More options" aria-haspopup="true" aria-expanded="false">&#8942;</button>
      <div class="menu" id="menu" role="menu" hidden>
        <button role="menuitem" data-go="targets">Targets and reminders</button>
        <p class="msync" id="sync" aria-live="polite"></p>
      </div>
    </div>
    <div class="datebar" id="datebar">
      <button class="dn" data-act="prev" aria-label="Previous day">&#8249;</button>
      <div class="dlabel"><span id="dtitle"></span><button class="chip" id="todaybtn" data-act="today" hidden>Back to today</button></div>
      <button class="dn" id="nextbtn" data-act="next" aria-label="Next day">&#8250;</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button class="tab" data-go="today"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Today</button>
    <button class="tab" data-go="week"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Week</button>
    <button class="tab" data-go="gym"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Gym</button>
    <button class="tab" data-go="diet"><svg viewBox="0 0 24 24"><path d="M12 8c-3-2-7 0-7 5 0 4 3 8 7 8s7-4 7-8c0-5-4-7-7-5zM12 8c0-2 1-3 3-4"/></svg>Diet</button>
    <button class="tab" data-go="sleep"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Sleep</button>
  </div>
</nav>
<div class="sheetbg" id="sheetbg" hidden data-act="avcancel"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Profile photo" hidden>
  <div class="grab" aria-hidden="true"></div>
  <p class="lbl">Profile photo</p>
  <label class="srow"><span class="sic"><svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>Take photo<input type="file" accept="image/*" capture="user" data-avatar="1" aria-label="Take a photo"></label>
  <label class="srow"><span class="sic"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-4 3 2.5 3-3 5 4.5"/></svg></span>Choose from gallery<input type="file" accept="image/*" data-avatar="1" aria-label="Choose a photo from your gallery"></label>
  <button class="srow" id="sheetrm" data-act="avclear"><span class="sic"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 12.5h8L17 7"/></svg></span>Remove photo</button>
  <button class="srow cancel" data-act="avcancel">Cancel</button>
</div>
<div class="crop" id="crop" role="dialog" aria-modal="true" aria-label="Crop photo" hidden>
  <p class="ctitle">Move and scale</p>
  <p class="chint">Drag to move, pinch to zoom</p>
  <div class="stage" id="cstage"><canvas id="ccv" width="320" height="320"></canvas><div class="cmask"></div></div>
  <div class="row cbtns"><button class="btn grow" data-act="cropcancel">Cancel</button><button class="btn pri grow" data-act="cropsave">Done</button></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var LS='dailygrind.v1',LSP='dailygrind.bgpic';
var LSA='dailygrind.avatar',AVA='';try{AVA=localStorage.getItem(LSA)||''}catch(e){}
var BM={u:'cm',h:'',ft:'',inch:'',w:'',init:false};
var PIC='';try{PIC=localStorage.getItem(LSP)||''}catch(e){}
var BGS=[['auto','Auto','#8FA0B3'],['navy','Navy','#0A1426'],['charcoal','Charcoal','#1C1C1E'],['forest','Forest','#12271E'],['plum','Plum','#2E1D42'],['sand','Sand','#F4EDE0'],['sky','Sky','#BCDDF3']];
var AREAS={gym:{n:'Gym',c:'--gym'},diet:{n:'Diet',c:'--diet'},sleep:{n:'Sleep',c:'--sleep'}};
var ORDER=['gym','diet','sleep'];
var ROUTES=['today','week','gym','diet','sleep','targets','profile','bmi'];
var SPLIT=['Rest','Legs','Push','Pull','Legs','Push','Pull'];
var LIFTS=['Squat','Leg press','Romanian deadlift','Leg curl','Bench press','Incline press','Shoulder press','Triceps pushdown','Skull crusher','Lat pulldown','Barbell row','Seated row','Pull-up','Biceps curl','Hammer curl'];
var FOODS=[['Eggs (2 boiled)',155,13,1,0],['Roti',100,3,18,3],['Rice (1 cup)',200,4,44,1],['Dal (1 bowl)',130,7,20,5],['Paneer (100 g)',265,18,4,0],['Curd (1 bowl)',100,6,8,0],['Banana',105,1,27,3],['Whey (1 scoop)',120,24,3,0]];
var SIL='<svg viewBox="0 0 24 24" width="60%" height="60%" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8.5" r="4.2"/><path d="M3.5 21.5c0-4.9 3.8-7.6 8.5-7.6s8.5 2.7 8.5 7.6z"/></svg>';
var CHECK='<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parseKey=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d)};
var todayKey=function(){return keyOf(new Date())};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var clamp01=function(x){return Math.max(0,Math.min(1,x))};
var sum=function(a,f){return a.reduce(function(s,x){return s+(+x[f]||0)},0)};
var nowHM=function(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
var toMin=function(t){var m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?(+m[1])*60+(+m[2]):1e9};
var fmtTime=function(m){m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
var hm=function(m){m=Math.round(m);return m<60?m+'m':Math.floor(m/60)+'h '+pad(m%60)+'m'};
var fmtDate=function(k){return parseKey(k).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
var DAYL=['S','M','T','W','T','F','S'];

/* ---------- state ---------- */
function defaults(){return {v:2,u:0,days:{},hist:{},
  set:{pf:{},bg:'auto',k:2400,p:120,c:300,f:30,w:12,sl:7,bed:'22:00',wk:'05:00',
    rem:[
      {id:'r1',t:'05:30',l:'Gym session',a:'gym',on:true},
      {id:'r2',t:'08:00',l:'Breakfast, then log it',a:'diet',on:true},
      {id:'r4',t:'13:00',l:'Lunch, then log it',a:'diet',on:true},
      {id:'r5',t:'17:30',l:'Water check',a:'diet',on:true},
      {id:'r6',t:'21:30',l:'Screens off, start your wind-down',a:'sleep',on:true}
    ]}};}
function merge(o){
  var d=defaults();
  if(!o||typeof o!=='object')return d;
  var s=o.set||{},old=(o.v||1)<2;
  var out=Object.assign({},d,{u:o.u||0,days:o.days||{},hist:o.hist||{}});
  out.set=Object.assign({},d.set,{k:s.k||d.set.k,p:s.p||d.set.p,c:s.c||d.set.c,f:s.f||d.set.f,w:s.w||d.set.w});
  if(!old){
    if(typeof s.bg==='string'&&s.bg)out.set.bg=s.bg;
    out.set.pf=(s.pf&&typeof s.pf==='object')?Object.assign({},s.pf):{};
    ['sl','bed','wk'].forEach(function(key){if(s[key]!=null&&s[key]!=='')out.set[key]=s[key]});
    out.set.rem=(Array.isArray(s.rem)?s.rem:d.set.rem).filter(function(r){return r&&ORDER.indexOf(r.a)>=0});
  }
  return out;
}
function loadLocal(){try{var r=localStorage.getItem(LS);if(r)return merge(JSON.parse(r))}catch(e){}return null}
var S=loadLocal()||defaults();
var VD=todayKey(), lastToday=todayKey();
var mondayOf=function(k){return addDays(k,-((parseKey(k).getDay()+6)%7))};
var WK=mondayOf(todayKey());
var monthOf=function(k){return k.slice(0,8)+'01'};
var MO=monthOf(todayKey());
var route=readRoute();
function readRoute(){try{var h=(location.hash||'').slice(1);return ROUTES.indexOf(h)>=0?h:'today'}catch(e){return 'today'}}

function R(k){var d=S.days[k]||{};return {gym:d.gym||{items:{},lifts:[]},diet:d.diet||{meals:[],water:0},sleep:d.sleep||{items:{}},rd:d.rd||{}}}
function D(k){var d=S.days[k]||(S.days[k]={});
  d.gym=d.gym||{items:{},lifts:[]};d.gym.items=d.gym.items||{};d.gym.lifts=d.gym.lifts||[];
  d.diet=d.diet||{meals:[],water:0};
  d.sleep=d.sleep||{items:{}};d.sleep.items=d.sleep.items||{};
  d.rd=d.rd||{};return d}

/* ---------- scores ---------- */
function splitOf(k){var d=S.days[k];if(d&&d.gym&&d.gym.rest)return 'Rest';return (d&&d.gym&&d.gym.split)||SPLIT[parseKey(k).getDay()]}
function gymItems(k){var sp=splitOf(k);
  if(sp==='Rest')return [['rest','Rest day: stretch or an easy walk']];
  var blk={Push:'Triceps block',Pull:'Biceps block',Legs:'Forearm block'}[sp]||'Accessory work';
  var cardio=sp==='Legs'?['cardio','Cardio or treadmill (optional)',1]:['cardio','Cardio or treadmill'];
  return [['warm','Warm-up'],['main','Main lifts'],['acc',blk],cardio,['cool','Cool-down stretch']]}
function gymCore(k){return gymItems(k).filter(function(x){return !x[2]})}
function gymScore(k){var it=gymCore(k),g=R(k).gym;if(g.rest)return 1;return it.filter(function(x){return g.items[x[0]]}).length/it.length}
function dietTot(k){var d=R(k).diet,r=function(f){return +sum(d.meals,f).toFixed(1)};return {k:Math.round(sum(d.meals,'k')),p:r('p'),c:r('c'),f:r('f'),w:d.water||0,n:d.meals.length}}
function dietScore(k){var t=dietTot(k);return (clamp01(t.p/S.set.p)+clamp01(t.w/S.set.w)+clamp01(t.n/3))/3}

function sleepItems(){return [['screens','Phone and screens off 30 minutes before bed'],['dinner','Last meal at least 2 hours before bed'],['plan','Pack up and plan tomorrow'],['alarm','Alarm is set']]}
function sdiff(a,t){return ((toMin(a)-toMin(t)+2160)%1440)-720}
function devText(a,t){var d=sdiff(a,t);return Math.abs(d)<=30?'on time':hm(Math.abs(d))+(d>0?' late':' early')}
function timeScore(a,t){var d=Math.abs(sdiff(a,t));return d<=30?1:clamp01(1-(d-30)/90)}
function sleepDur(k){var s=R(k).sleep;if(!s.bed||!s.wake)return null;return (toMin(s.wake)-toMin(s.bed)+1440)%1440}
function sleepScore(k){
  var s=R(k).sleep,dur=sleepDur(k),L=0;
  if(dur!=null)L=(clamp01(dur/(S.set.sl*60))+timeScore(s.bed,S.set.bed)+timeScore(s.wake,S.set.wk))/3;
  var it=sleepItems(),C=it.filter(function(x){return s.items[x[0]]}).length/it.length;
  return 0.6*L+0.4*C}

function areaScores(k){
  if(S.days[k]||k===todayKey())return [gymScore(k),dietScore(k),sleepScore(k)];
  if(S.hist[k])return S.hist[k].s;
  return [0,0,0]}
function overall(k){var s=areaScores(k);return (s[0]+s[1]+s[2])/3}
function streak(fn,thr){var k=todayKey(),n=0;if(fn(k)<thr)k=addDays(k,-1);
  while(fn(k)>=thr&&n<500){n++;k=addDays(k,-1)}return n}
function areaFn(i){return function(k){return areaScores(k)[i]}}
function compact(){var cut=addDays(todayKey(),-120);
  Object.keys(S.days).forEach(function(k){if(k<cut){S.hist[k]={s:areaScores(k).map(function(x){return +x.toFixed(2)})};delete S.days[k]}})}

/* ---------- phone alarms (only inside the Android app) ---------- */
var NATIVE=false,LN=null,alarmMsg='',alarmSig='';
try{NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());LN=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.LocalNotifications:null}catch(e){}
function alarmId(str){var h=7;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))%2000000000;return h+1}
function refreshTargets(){if(route==='targets')render()}
async function syncAlarms(ask){
  if(!LN)return;
  try{
    var pm=await LN.checkPermissions();
    if(pm.display!=='granted'&&ask!==false)pm=await LN.requestPermissions();
    if(pm.display!=='granted'){alarmMsg='Notifications are blocked. Tap "Allow alarms" below, or allow notifications for Daily Grind in phone settings.';refreshTargets();return}
    await LN.createChannel({id:'alarms',name:'Daily reminders',description:'Gym, meals, water and sleep reminders',importance:5,visibility:1,vibration:true,lights:true});
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.filter(function(n){return n.id!==999991}).map(function(n){return {id:n.id}})});
    var list=[];
    S.set.rem.forEach(function(r){var m=/^(\d{1,2}):(\d{2})$/.exec(r.t||'');if(!r.on||!m)return;
      list.push({id:alarmId(r.id),title:'Daily Grind',body:r.l,channelId:'alarms',smallIcon:'ic_stat',schedule:{on:{hour:+m[1],minute:+m[2]},allowWhileIdle:true}})});
    if(list.length)await LN.schedule({notifications:list});
    alarmSig=JSON.stringify(S.set.rem);
    alarmMsg=list.length?list.length+' daily alarm'+(list.length===1?'':'s')+' set. They ring even when the app is closed.':'No alarms are turned on.';
  }catch(e){alarmMsg='Could not set alarms: '+(e&&e.message?e.message:'unknown error')}
  refreshTargets()}
async function allowAlarms(){
  if(!LN)return;
  try{var pm=await LN.requestPermissions();
    if(LN.checkExactNotificationSetting){var ex=await LN.checkExactNotificationSetting();if(ex&&ex.exact_alarm&&ex.exact_alarm!=='granted'&&LN.changeExactNotificationSetting)await LN.changeExactNotificationSetting()}
  }catch(e){}
  syncAlarms(false)}
async function testAlarm(){
  if(!LN)return;
  try{var pm=await LN.checkPermissions();if(pm.display!=='granted')pm=await LN.requestPermissions();
    if(pm.display!=='granted'){toast('Allow notifications first');return}
    await LN.createChannel({id:'alarms',name:'Daily reminders',description:'Gym, meals, water and sleep reminders',importance:5,visibility:1,vibration:true,lights:true});
    await LN.schedule({notifications:[{id:999991,title:'Daily Grind',body:'Test alarm: your alarms work',channelId:'alarms',smallIcon:'ic_stat',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
    toast('Test alarm in 10 seconds. You can close the app.')}catch(e){toast('Could not set the test alarm')}}

/* ---------- save ---------- */
var dirty=false,saving=false,saveTimer=null;
function setStatus(t){var el=$('#sync');if(el)el.textContent=t}
function touch(){S.u=Date.now();dirty=true;setStatus('Saving...');clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
function flush(){
  if(saving){saveTimer=setTimeout(flush,400);return}
  compact();
  try{localStorage.setItem(LS,JSON.stringify(S));dirty=false;setStatus('Saved on this phone');if(LN&&JSON.stringify(S.set.rem)!==alarmSig)syncAlarms(false)}
  catch(e){setStatus('Could not save. Phone storage may be full or blocked')}
}

/* ---------- ui helpers ---------- */
var toastT=null;
function toast(m){var el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true},2200)}
function ringBox(p,c,size,label){var C=2*Math.PI*18;
  var arc=p>0.01?'<circle class="rp" cx="22" cy="22" r="18" stroke-dasharray="'+(C*clamp01(p)).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 22 22)"/>':'';
  return '<div class="ringw" style="width:'+size+'px;height:'+size+'px;--c:var('+c+')"><svg viewBox="0 0 44 44" width="'+size+'" height="'+size+'" aria-hidden="true"><circle class="rt" cx="22" cy="22" r="18"/>'+arc+'</svg><span class="rl num" style="font-size:'+Math.round(size*.3)+'px">'+label+'</span></div>'}
function vhead(a,label,sub,p){return '<div class="vhead" style="--c:var('+AREAS[a].c+')"><div><p class="lbl">'+label+'</p><h2>'+sub+'</h2></div>'+ringBox(p,AREAS[a].c,68,Math.round(p*100)+'%')+'</div>'}
function meter(l,v,t,txt,c,over){var p=t>0?clamp01(v/t):0;
  return '<div class="meter" style="--c:var('+(over?'--danger':c)+');--p:'+(p*100).toFixed(0)+'%"><div class="mrow"><span>'+l+'</span><b class="num'+(over?' over':'')+'">'+txt+'</b></div><div class="bar"><i></i></div></div>'}
function bars(o){
  var W=320,H=132,pl=6,top=16,bot=22,n=o.vals.length,gap=10,bw=(W-pl*2-gap*(n-1))/n,ph=H-top-bot;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'" style="--c:var('+o.color+')">';
  if(o.target!=null){var y0=top+ph*(1-clamp01(o.target/o.max));
    s+='<line class="grid" x1="0" x2="'+W+'" y1="'+y0.toFixed(1)+'" y2="'+y0.toFixed(1)+'"/><text x="'+(W-2)+'" y="'+(y0-3).toFixed(1)+'" text-anchor="end">'+esc(o.tlabel||'')+'</text>'}
  o.vals.forEach(function(v,i){
    var h=Math.max(v>0?2:0,ph*clamp01(v/o.max)),x=pl+i*(bw+gap),y=top+ph-h;
    s+='<rect class="b'+(i===o.hi?' hi':'')+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3"/>';
    if(v>0)s+='<text class="vl" x="'+(x+bw/2).toFixed(1)+'" y="'+(y-3).toFixed(1)+'" text-anchor="middle">'+o.fmt(v)+'</text>';
    s+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(o.labels[i])+'</text>'});
  return s+'</svg>'}
function lastDays(n,end){var a=[];for(var i=n-1;i>=0;i--)a.push(addDays(end||VD,-i));return a}
function weekdayInitial(k){return DAYL[parseKey(k).getDay()]}
function spark(pts,c){
  var W=320,H=90,p=10,vs=pts.map(function(q){return q.v}),mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs),rg=Math.max(mx-mn,1);
  var t0=parseKey(pts[0].k).getTime(),dt=Math.max(parseKey(pts[pts.length-1].k).getTime()-t0,1);
  var xy=pts.map(function(q){return [p+(W-2*p)*(parseKey(q.k).getTime()-t0)/dt,p+8+(H-2*p-16)*(1-(q.v-mn)/rg)]});
  var d='M'+xy.map(function(a){return a[0].toFixed(1)+','+a[1].toFixed(1)}).join(' L');
  var last=xy[xy.length-1];
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Body weight trend" style="--c:var('+c+')"><path class="ln" d="'+d+'"/><circle class="dot" cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4"/><text x="'+p+'" y="10">'+mx+' kg</text><text x="'+p+'" y="'+(H-2)+'">'+mn+' kg</text></svg>'}

/* ---------- views ---------- */
function lane(a,s){
  var A=AREAS[a],i=ORDER.indexOf(a),k=VD,isT=k===todayKey(),str=streak(areaFn(i),.8),stat='',act='';
  if(a==='gym'){var it=gymCore(k),g=R(k).gym,done=it.filter(function(x){return g.items[x[0]]}).length,sp=splitOf(k);
    stat=g.rest?'Rest day · recovery counts as done':(sp==='Rest'?'Rest day':sp+' day')+' · '+done+' of '+it.length+' steps';
    var nx=it.filter(function(x){return !g.items[x[0]]})[0];
    act=g.rest?'<button class="btn sm" data-act="unrest">Undo rest day</button>':(nx?'<button class="btn sm" data-act="gnext">Tick: '+esc(nx[1].split(':')[0])+'</button>':'<span class="done">All steps done</span>');

  var av=function(a){return a.reduce(function(x,y){return x+y},0)/a.length};

function loadPic(file){
  if(!file)return;var fr=new FileReader();
  fr.onload=function(){var im=new Image();
    im.onload=function(){var sc=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      PIC=c.toDataURL('image/jpeg',.72);
      try{localStorage.setItem(LSP,PIC)}catch(e){toast('Picture works now, but could not be saved on this phone')}
      S.set.bg='photo';touch();render()};
    im.onerror=function(){toast('Could not read that picture')};
    im.src=fr.result};
  fr.onerror=function(){toast('Could not read that picture')};
  fr.readAsDataURL(file)}

function act(a,ds){
  var k=VD;
  switch(a){
    case 'prev':VD=addDays(VD,-1);break;
    case 'next':if(VD<todayKey())VD=addDays(VD,1);break;
    case 'today':VD=todayKey();break;
    case 'goto':VD=ds.d;break;
    case 'avclear':{closeSheet();AVA='';try{localStorage.removeItem(LSA)}catch(e){}break}
    case 'applysug':{var sg=suggestion();if(sg){S.set.k=sg.k;S.set.p=sg.p;S.set.c=sg.c;S.set.f=sg.f;touch();toast('Targets updated')}break}
    case 'menu':{var mn=$('#menu');mn.hidden=!mn.hidden;$('#morebtn').setAttribute('aria-expanded',String(!mn.hidden));return}
    case 'allowalarms':allowAlarms();return;
    case 'testalarm':testAlarm();return;
    case 'avsheet':openSheet();return;
    case 'avcancel':closeSheet();return;
    case 'cropcancel':closeCrop();return;
    case 'cropsave':saveCrop();return;
    case 'bgset':S.set.bg=ds.id;touch();break;
    case 'bgclear':{PIC='';try{localStorage.removeItem(LSP)}catch(e){}if(S.set.bg==='photo')S.set.bg='auto';touch();break}
    case 'restday':{var gr=D(k).gym;gr.rest=true;gr.items={};touch();toast('Rest day saved. Streak is safe');break}
    case 'unrest':{var gu=D(k).gym;gu.rest=false;gu.items={};touch();break}
    case 'mprev':{var pm=parseKey(MO);MO=keyOf(new Date(pm.getFullYear(),pm.getMonth()-1,1));break}
    case 'mnext':if(MO<monthOf(todayKey())){var nm=parseKey(MO);MO=keyOf(new Date(nm.getFullYear(),nm.getMonth()+1,1))}break;
    case 'wprev':WK=addDays(WK,-7);break;
    case 'wnext':if(WK<mondayOf(todayKey()))WK=addDays(WK,7);break;
    case 'wthis':WK=mondayOf(todayKey());break;
    case 'wday':VD=ds.d;route='today';try{location.hash='today'}catch(e){}break;
    case 'tog':{var g=D(k).gym;g.items[ds.id]=!g.items[ds.id];touch();break}
    case 'gnext':{var it=gymCore(k).filter(function(x){return !R(k).gym.items[x[0]]})[0];if(it){D(k).gym.items[it[0]]=true;touch()}break}
    case 'water':{var d=D(k).diet;d.water=Math.max(0,(d.water||0)+(+ds.d));touch();break}
    case 'del':{var dd=D(k),arr={lift:dd.gym.lifts,meal:dd.diet.meals}[ds.kind];
      var i=arr?arr.findIndex(function(x){return x.id===ds.id}):-1;if(i>=0){arr.splice(i,1);touch()}break}
    case 'food':{var f=FOODS[+ds.i],form=$('form[data-form=meal]');if(form&&f){var el=form.elements;el.n.value=f[0];el.k.value=f[1];el.p.value=f[2];el.c.value=f[3];el.f.value=f[4];el.n.focus()}return}
    case 'stog':{var sl=D(k).sleep;sl.items[ds.id]=!sl.items[ds.id];touch();break}
    case 'awake':{D(todayKey()).sleep.wake=nowHM();touch();toast('Wake-up time saved');break}
    case 'dismiss':D(todayKey()).rd[ds.id]=1;touch();break;
    case 'remadd':S.set.rem.push({id:uid(),t:'07:00',l:'New reminder',a:'gym',on:true});touch();break;
    case 'remdel':S.set.rem=S.set.rem.filter(function(r){return r.id!==ds.id});touch();break;
    default:return;
  }
  render();
}

  if(e.target.closest('#menu [data-go]'))closeMenu();
  var a=e.target.closest('[data-act]');if(a){act(a.dataset.act,a.dataset);return}
  var g=e.target.closest('[data-go]');if(g){nav(g.dataset.go)}
});
function bmiHeight(){
  var g=function(k){var el=$('[data-bmi='+k+']');return el?parseFloat(el.value):NaN};
  var cm=$('[data-bmi=h]');
  if(cm)return g('h');
  var f=g('ft'),i=g('in');return (isNaN(f)&&isNaN(i))?NaN:(f||0)*30.48+(i||0)*2.54}
document.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||!t.dataset.bmi)return;
  var val=function(k){var el=$('[data-bmi='+k+']');return el?el.value:null};
  if(route==='bmi'){var a=val('h');if(a!=null)BM.h=a;a=val('ft');if(a!=null)BM.ft=a;a=val('in');if(a!=null)BM.inch=a;a=val('w');if(a!=null)BM.w=a}
  var o=$('#bmiout');
  if(o)o.innerHTML=bmiOut(bmiHeight(),parseFloat(val('w')),+((S.set.pf||{}).gw)||0)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.bmiu){var hc=bmiHeight();BM.u=t.value;
    if(hc>0){if(BM.u==='ft'){var tot=hc/2.54;BM.ft=String(Math.floor(tot/12));BM.inch=String(+(tot%12).toFixed(1))}else BM.h=String(+hc.toFixed(1))}
    render();return}
  if(t.dataset.avatar){loadAvatar(t.files&&t.files[0]);t.value='';return}
  if(t.dataset.pf){var pk=t.dataset.pf,pf=S.set.pf||(S.set.pf={});
    if(t.type==='number'){var pv=parseFloat(t.value);if(pv>0)pf[pk]=pv;else delete pf[pk]}else if(t.value)pf[pk]=t.value.trim();else delete pf[pk];
    touch();render();return}
  if(t.dataset.pic){loadPic(t.files&&t.files[0]);t.value='';return}
  if(t.dataset.change==='split'){var gs=D(VD).gym;gs.split=t.value;gs.rest=false;touch();render();return}
  if(t.dataset.set){var key=t.dataset.set;
    if(t.type==='number'){var v=parseFloat(t.value);if(!(v>0))return;S.set[key]=v}
    else if(t.type==='time'){if(!t.value)return;S.set[key]=t.value}
    else S.set[key]=t.value;
    touch();return}
  if(t.dataset.rem){var r=S.set.rem.filter(function(x){return x.id===t.dataset.rem})[0];if(!r)return;
    var f=t.dataset.f;if(f==='on')r.on=t.checked;else r[f]=t.value;touch();renderBanner()}
});
document.addEventListener('submit',function(e){
  var f=e.target,kind=f.dataset.form;if(!kind)return;e.preventDefault();
  var fd=new FormData(f),k=VD,d=D(k),num=function(x){var v=parseFloat(x);return isFinite(v)?v:0};
  if(kind==='lift'){var n=String(fd.get('n')||'').trim();if(!n)return;
    d.gym.lifts.push({id:uid(),n:n,w:num(fd.get('w')),s:parseInt(fd.get('s'))||1,r:parseInt(fd.get('r'))||1})}
  else if(kind==='bw'){var v=num(fd.get('v'));if(v<=0)return;d.gym.bw=v}
  else if(kind==='meal'){var mn=String(fd.get('n')||'').trim();if(!mn)return;
    d.diet.meals.push({id:uid(),n:mn,k:Math.round(num(fd.get('k'))),p:+num(fd.get('p')).toFixed(1),c:+num(fd.get('c')).toFixed(1),f:+num(fd.get('f')).toFixed(1),t:nowHM()})}
  else if(kind==='sleep'){var b=String(fd.get('bed')||''),w=String(fd.get('wake')||'');if(!b||!w)return;d.sleep.bed=b;d.sleep.wake=w}
  else return;
  touch();render();
});

/* ---------- timers ---------- */
setInterval(function(){
  var t=todayKey();
  if(t!==lastToday){if(VD===lastToday)VD=t;lastToday=t;render()}else renderBanner();
},30000);

render();
setStatus('Saved on this phone');
syncAlarms(true);
try{if(!NATIVE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
})();
</script>
